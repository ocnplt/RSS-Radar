```yaml
# ═══════════════════════════════════════════════════════════════════════════
# RSS-Radar Configuration
# ═══════════════════════════════════════════════════════════════════════════

profile:
  name: "Electric Vehicles, AI, Crowdshipping & Optimization Research Radar"
  description: |
    Research radar focused on electric vehicles, electric mobility,
    artificial intelligence, machine learning, deep learning, attention
    mechanisms, transformers, optimization, crowdshipping, logistics,
    routing, manufacturing and intelligent transportation systems.

# ──────────────────────────────────────────────────────────────────────────
# Schedule
# ──────────────────────────────────────────────────────────────────────────

schedule_utc: "0 17 * * 1"

schedule_local:
  hour: 20
  minute: 0
  tz_offset: 3
  days: "1"

# ──────────────────────────────────────────────────────────────────────────
# LLM provider
# ──────────────────────────────────────────────────────────────────────────

llm:
  provider: "gemini"
  model: "gemini-2.5-flash"
  fallback_provider: "gemini"
  fallback_model: "gemini-2.5-flash"
  language: "tr"
  max_items_per_run: 60
  relevance_threshold: 4

# ──────────────────────────────────────────────────────────────────────────
# Keywords
#
# Pre-score =
# (#critical matches × 3)
# + (#core matches × 2)
# + (#related matches × 1)
# − (#exclude matches × 3)
#
# Only items with pre-score >= 2 are sent to the LLM.
# ──────────────────────────────────────────────────────────────────────────

keywords:

