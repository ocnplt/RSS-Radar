name: Daily RSS-Radar

on:
workflow_dispatch:
schedule:
- cron: "0 17 * * 1"

permissions:
contents: write

jobs:
scan:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout repository
    uses: actions/checkout@v6

  - name: Setup Python
    uses: actions/setup-python@v6
    with:
      python-version: "3.11"

  - name: Install dependencies
    run: pip install -r requirements.txt

  - name: Run RSS-Radar
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    run: python scripts/fetch_and_report.py

  - name: Commit results
    run: |
      git config user.name "rss-radar-bot"
      git config user.email "bot@users.noreply.github.com"
      git add data/ docs/
      if ! git diff --staged --quiet; then
        git commit -m "daily: scan results $(date -u +%Y-%m-%d)"
        git push
      else
        echo "No changes."
      fi
```
